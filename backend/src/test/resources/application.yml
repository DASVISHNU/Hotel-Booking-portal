# Test configuration: in-memory H2 in MySQL mode, so tests run without a local MySQL server.
spring:
  datasource:
    url: jdbc:h2:mem:hotel_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  timezone: Asia/Kolkata
  cors:
    allowed-origins: http://localhost:5173
