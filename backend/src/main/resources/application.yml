# Credentials come from environment variables (or a git-ignored backend/.env file) — never from this file.
spring:
  application:
    name: hotel-booking-portal
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hotel_booking?serverTimezone=Asia/Kolkata&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:hotel_app}
    password: ${DB_PASSWORD}
  jpa:
    # Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate never alters it.
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: Asia/Kolkata
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
